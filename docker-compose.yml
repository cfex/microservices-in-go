version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
      - "--api.dashboard=true"
    ports:
      - "80:80" # HTTP entrypoint
      - "8080:8080" # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - microservices
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hubdb
    ports:
      - "5433:5432" # Host:Container
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: ./services/users-service/Dockerfile
      target: dev
    container_name: user-service
    command: ["air", "-c", ".air.toml"]
    working_dir: /app/services/users-service
    ports:
      - "5000:5000" # HTTP port
      - "50051:50051" # gRPC port
    volumes:
      - ./services/users-service:/app/services/users-service
      - ./:/app/
      - /app/services/users-service/tmp # Exclude tmp folder from sync
    environment:
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hubdb
      HTTP_PORT: :5000
      GRPC_PORT: :50051
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/api/users`) || PathPrefix(`/api/auth`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.routers.users.middlewares=users-ratelimit"
      - "traefik.http.services.users.loadbalancer.server.port=5000"
      # Rate Limiting
      - "traefik.http.middlewares.users-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.users-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.users-ratelimit.ratelimit.period=1s"

  projects-service:
    build:
      context: .
      dockerfile: ./services/projects-service/Dockerfile
      target: dev
    container_name: projects-service
    command: ["air", "-c", ".air.toml"]
    working_dir: /app/services/projects-service
    ports:
      - "5100:5100" # HTTP port
    volumes:
      - ./services/projects-service:/app/services/projects-service
      - ./:/app/
      - /app/services/projects-service/tmp # Exclude tmp folder from sync
    environment:
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hubdb
      HTTP_PORT: :5100
      USERS_GRPC_ADDR: user-service:50051 # Docker service name + gRPC port
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - microservices
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.projects.rule=PathPrefix(`/api/projects`)"
      - "traefik.http.routers.projects.entrypoints=web"
      - "traefik.http.routers.projects.middlewares=projects-ratelimit"
      - "traefik.http.services.projects.loadbalancer.server.port=5100"
      # Rate Limiting
      - "traefik.http.middlewares.projects-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.projects-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.projects-ratelimit.ratelimit.period=1s"

volumes:
  postgres-data:
    driver: local

networks:
  microservices:
    driver: bridge
