syntax = "proto3";

option go_package = "github.com/cfex/microservices-in-go/services/common/pb;pb";


service UserService { 
  rpc GetUserById(GetUserRequest) returns (UserResponse) {}
}

message GetUserRequest {
  string ID = 1;
}
message UserResponse {
  string ID = 1;
  string Username = 2;
  string Email = 3;
  string Role = 4;
}
